#------------------------- esp32 + electronica7_rgb (с macros) -------------------------
[env:esp32_electronica7_rgb_macros]
extends = env:esp32
; Единая таблица ESP32 (app0/app1 1472 КБ, spiffs 1080 КБ) из корня ядра.
board_build.partitions = partitions_esp32.csv
src_filter = ${env:esp32.src_filter} +<module_udp/> +<module_otaclient/> +<module_ds3231/> +<module_macros/> +<device_electronica7_rgb/> +<module_veml7700/>
build_flags=
	${env.build_flags}
	${env:esp32.build_flags}
	-D DEBUG_E7RGB
	-D DEBUG_MACROS=1
	-D DEBUG_CORE_WIFI
	-D DEBUG_OTA
	-D DEBUG_STATE=1
	-D DEBUG_TASK=1
	-D DEBUG_SYS
	-D DEBUG_VEML7700=1
	; Увеличенные стеки: loop-задача исполняет Lua-сценарии, AsyncTCP — веб-запросы.
	-D ARDUINO_LOOP_STACK_SIZE=16384
	-D CONFIG_ASYNC_TCP_STACK_SIZE=16384
	; Вывод ленты: по умолчанию I2S+DMA (NeoEsp32I2s0Ws2812xMethod).
	; Для ESP32-C3/S3 или при проблемах I2S включить RMT (NeoEsp32Rmt0Ws2812xMethod):
	; -D E7_USE_RMT=1
lib_deps =
	${env.lib_deps}
	${env:esp32.lib_deps}

#------------------------- esp32 + electronica7_rgb (без macros) -------------------------
[env:esp32_electronica7_rgb]
extends = env:esp32
src_filter = ${env:esp32.src_filter} +<module_udp/> +<module_otaclient/> +<module_ds3231/> +<device_electronica7_rgb/>
build_flags=
	${env.build_flags}
	${env:esp32.build_flags}
	-D DEBUG_E7RGB
	-D DEBUG_OTA
	-D DEBUG_STATE=1
	-D DEBUG_TASK=1
lib_deps =
	${env.lib_deps}
	${env:esp32.lib_deps}

#------------------------- registry (автогенерация modules_registry) -------------------------
[registry]
object = device_electronica7_rgb
define = DEVICE_E7RGB
namespace = e7
web = 1
loop = 0
res = 1
prio = 70
