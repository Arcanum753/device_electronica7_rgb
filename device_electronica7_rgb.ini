#------------------------- esp32 + electronica7_rgb (с macros) -------------------------
[env:esp32_electronica7_rgb_macros]
extends = env:esp32
; Lua-движок требует увеличенных app-разделов: своя таблица партиций ядра.
board_build.partitions = partitions_esp32_macro.csv
src_filter = ${env:esp32.src_filter} +<module_udp/> +<module_otaclient/> +<module_macros/> +<device_electronica7_rgb/>
build_flags=
	${env.build_flags}
	${env:esp32.build_flags}
	-D MODULE_UDP=1
	-D MODULE_OTACLIENT=1
	-D MODULE_MACROS=1
	-D DEVICE_E7RGB=1
	-D DEBUG_E7RGB
	-D DEBUG_MACROS=1
	; Отладка — только у самого модуля. Базовый DEBUG_OTA из [env] гасим, RELEASE не задаём.
	-D DEBUG_OTA
	-D DEBUG_STATE=1
	-D DEBUG_TASK=1
	-D DEBUG_WIFI
	; Вывод ленты: по умолчанию I2S+DMA (NeoEsp32I2s0Ws2812xMethod).
	; Для ESP32-C3/S3 или при проблемах I2S включить RMT (NeoEsp32Rmt0Ws2812xMethod):
	; -D E7_USE_RMT=1
lib_deps =
	${env.lib_deps}
	${env:esp32.lib_deps}

#------------------------- esp32 + electronica7_rgb (без macros) -------------------------
[env:esp32_electronica7_rgb]
extends = env:esp32
src_filter = ${env:esp32.src_filter} +<module_udp/> +<module_otaclient/> +<device_electronica7_rgb/>
build_flags=
	${env.build_flags}
	${env:esp32.build_flags}
	-D MODULE_UDP=1
	-D MODULE_OTACLIENT=1
	-D DEVICE_E7RGB=1
	-D DEBUG_E7RGB
	-D DEBUG_OTA
	-D DEBUG_STATE=1
	-D DEBUG_TASK=1
lib_deps =
	${env.lib_deps}
	${env:esp32.lib_deps}

#------------------------- registry (автогенерация modules_registry) -------------------------
[registry]
object = device_electronica7_rgb
define = DEVICE_E7RGB
namespace = e7
web = 1
loop = 0
res = 1
prio = 70
